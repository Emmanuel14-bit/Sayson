<!DOCTYPE html>
<html>
<head>
  <title>To Do List</title>

  <style>
    body {
      font-family: "Times New Roman";
      font-size: 20px;
      margin: 30px;
    }

    h1 {
      color: purple;
      font-size: 45px;
    }

    h2 {
      color: purple;
      font-size: 35px;
    }

    .today {
      color: red;
    }

    .blue {
      color: blue;
    }

    .green {
      color: green;
    }

    .other {
      margin-left: 40px;
      font-size: 13px;
    }

    .quote {
      font-size: 24px;
    }
  </style>
</head>

<body>

  <h1>To Do List</h1>

  <h2>Monday</h2>

  <p class="today">Do these things today!</p>

  <ul>
    <li class="blue">Wash Clothes</li>
    <li class="green">Read</li>
    <li class="green">Maths Questions</li>
  </ul>

  <p class="other">Other items</p>

  <p class="quote">The best preparation for tomorrow is doing your best today.</p>

</body>
</html>
